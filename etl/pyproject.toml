[project]
name = "oripol-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "pyyaml>=6", "httpx>=0.27", "fastexcel>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oripol_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
