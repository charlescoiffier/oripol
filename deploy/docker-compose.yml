# Modèle de déploiement pour oripol.charlescoiffier.fr (généré par scripts/new-site.sh)
# Copié automatiquement sur le VPS dans ~/srv/oripol/ à chaque déploiement.
# Variables d'environnement de l'appli : fichier ~/srv/oripol/.env sur le VPS (optionnel, jamais commité).
services:
  app:
    image: ghcr.io/charlescoiffier/oripol:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks: [web]
    # Garde-fous : une appli qui s'emballe ne doit pas faire tomber les autres sites (VPS : 1 cœur, 3,8 Go)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.oripol.rule=Host(`oripol.charlescoiffier.fr`)
      - traefik.http.routers.oripol.tls.certresolver=le
      - traefik.http.services.oripol.loadbalancer.server.port=8080

networks:
  web:
    external: true
