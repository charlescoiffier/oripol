name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # la version d'Ubuntu (2.49) produit des tuiles sans communes : on compile la 2.79.0 utilisée en local
      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0

      - name: Compiler tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          make -C /tmp/tippecanoe install PREFIX="$HOME/tippecanoe-bin"

      - name: Ajouter tippecanoe au PATH
        run: echo "$HOME/tippecanoe-bin/bin" >> "$GITHUB_PATH"

      # sources, résultats JSON et tuiles : régénérés à chaque déploiement (non versionnés)
      - name: Générer les données
        run: ./build-data.sh

      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci --engine-strict=false
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
