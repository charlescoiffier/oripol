name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      # sources, résultats JSON et tuiles : régénérés à chaque déploiement (non versionnés)
      - name: Générer les données
        run: ./build-data.sh

      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci --engine-strict=false
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
